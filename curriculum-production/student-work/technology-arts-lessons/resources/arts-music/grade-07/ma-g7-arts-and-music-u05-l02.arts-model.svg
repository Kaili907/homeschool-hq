<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="model-title model-description">
  <title id="model-title">space time and energy — relationship study</title><desc id="model-description">An Academy-original three-stage visual model for space time and energy. Stage one shows evenly weighted circle, rectangle, and triangle forms. Stage two isolates one dark circle and lowers contrast elsewhere. Stage three adds a directional path and a materially different alternate arrangement. Labels, pattern, value, size, and position carry the comparison without relying on colour alone.</desc>
  <rect width="960" height="520" fill="#fffaf0"/><text x="48" y="48" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#172033">space time and energy</text>
  <g font-family="system-ui,sans-serif" fill="#172033"><text x="48" y="90" font-size="16">1 — even start</text><text x="350" y="90" font-size="16">2 — isolate one relationship</text><text x="652" y="90" font-size="16">3 — build and test a path</text></g>
  <g stroke="#172033" stroke-width="4"><rect x="48" y="110" width="260" height="300" rx="16" fill="#f4efe3"/><circle cx="118" cy="205" r="32" fill="#969696"/><rect x="170" y="250" width="70" height="58" fill="#969696"/><path d="M105 360 L180 320 L255 365 Z" fill="#969696"/>
  <rect x="350" y="110" width="260" height="300" rx="16" fill="#f4efe3"/><circle cx="414" cy="188" r="27" fill="#20242b"/><rect x="470" y="250" width="72" height="58" fill="#a7a7a7"/><path d="M405 370 L490 322 L562 375 Z" fill="#ded7c8"/>
  <rect x="652" y="110" width="260" height="300" rx="16" fill="#f4efe3"/><circle cx="712" cy="185" r="26" fill="#20242b"/><rect x="764" y="245" width="70" height="58" fill="#a7a7a7"/><path d="M700 370 L795 320 L865 380 Z" fill="#ded7c8"/><path d="M735 200 Q790 205 798 240 Q810 305 820 330" fill="none" stroke="#7a4d22" stroke-width="6" stroke-dasharray="12 8"/></g>
  <g font-family="system-ui,sans-serif" font-size="15" fill="#172033"><text x="48" y="448">NON-EXAMPLE: equal weight leaves the route unsettled.</text><text x="48" y="478">WORKED CHANGE: one stronger relationship leads; quiet areas support it.</text><text x="48" y="506">VALID VARIATION: reverse, distribute, or soften the route when evidence serves the learner’s intent.</text></g></svg>
